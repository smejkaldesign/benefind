name: New match alerts

# Daily: re-check every saved screening against the current engine and email
# owners about newly matching programs. The app route does the work; this job
# only calls it. Needs repo secrets CRON_SECRET and APP_URL
# (e.g. https://benefind.ai).

on:
  schedule:
    - cron: "0 15 * * *" # 15:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute only. Send no email and write nothing."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: new-match-alerts
  cancel-in-progress: false

jobs:
  run:
    name: Send new match alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Call new-matches route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "::error::CRON_SECRET and APP_URL repo secrets are required"
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            --max-time 600 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/new-matches?dry_run=$DRY_RUN")
          cat response.json
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::new-matches route returned HTTP $status"
            exit 1
          fi
